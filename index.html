<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101019">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Elsewhere">
  <title>Elsewhere — Your OC Archive</title>
  <style>
    :root { color-scheme:dark; --bg:#0d0e15; --panel:#171822; --panel2:#20212e; --stroke:#343344; --text:#f4eff9; --muted:#aaa5bc; --accent:#bd92fa; --accent-soft:#352648; --radius:19px; }
    * {box-sizing:border-box} html {min-height:100%; background:var(--bg)}
    body {margin:0; min-height:100vh; min-height:100dvh; background: radial-gradient(ellipse 120% 380px at 50% -140px,#342341 0%,transparent 70%),var(--bg); color:var(--text); font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased;}
    button,input,textarea,select {font:inherit} button {cursor:pointer} button:disabled {opacity:.5;cursor:not-allowed}
    .shell {width:min(100%,860px); margin:auto; padding: max(22px,env(safe-area-inset-top)) 18px calc(55px + env(safe-area-inset-bottom));}
    .top {display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:24px}
    .brand {display:flex;align-items:center;gap:13px}.brandmark {height:43px;width:43px;display:grid;place-items:center;border-radius:15px;background:linear-gradient(135deg,#9e7ef8,#5d427e);font-size:23px;box-shadow:0 7px 26px #6e408844}
    .brandtitle {font-family:Georgia,serif; font-size:29px;letter-spacing:-.6px;font-weight:normal;line-height:1.2}.tagline {font-size:12px;color:var(--muted);margin-top:1px}
    .btn {border:1px solid var(--stroke);border-radius:13px;background:var(--panel2);color:var(--text);padding:10px 14px;min-height:42px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-align:center}
    .btn.primary {background:var(--accent);border-color:transparent;color:#15101e}.btn.ghost{background:transparent}.btn.danger{color:#ffa8b2}.btn.small{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
    .btn:focus-visible,.card:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    .row {display:flex;align-items:center;gap:9px;flex-wrap:wrap}.between{justify-content:space-between}.heading {font-size:25px;margin:6px 0 6px;font-family:Georgia,serif;font-weight:normal}.help {font-size:13px;color:var(--muted);margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:21px 0 12px}
    .search {width:100%;border:1px solid var(--stroke);border-radius:14px;background:var(--panel);color:var(--text);height:47px;padding:0 15px;margin-bottom:14px;}
    .switch {display:grid;grid-template-columns:1fr 1fr;gap:5px;background:var(--panel);border-radius:15px;padding:5px;margin:9px 0 18px;border:1px solid #292837}
    .switch button {background:transparent;color:var(--muted);border:0;padding:10px 0;border-radius:10px;font-weight:650}.switch button.active{background:#373044;color:#f6eaff}
    .cards {display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
    .card {border:1px solid var(--stroke);border-radius:var(--radius);background:linear-gradient(150deg,#1f1d2a,#171820);padding:15px;display:flex;align-items:center;gap:13px;width:100%;text-align:left;color:inherit;min-height:92px}
    .card .tile {width:56px;height:56px;flex:none;display:grid;place-items:center;border-radius:15px;font-family:Georgia,serif;font-size:25px;background:linear-gradient(135deg,var(--tile),#15131e);border:1px solid #ffffff22;overflow:hidden}
    .tile img {width:100%;height:100%;object-fit:cover}.card-content{min-width:0;flex:1}.card-title{font-weight:720;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-sub{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}.arrow{color:#9a91a7;font-size:20px}
    .empty {padding:40px 20px;text-align:center;border:1px dashed #4b4055;border-radius:20px;background:#17151d}.empty .emoji {font-size:34px;margin-bottom:8px}.empty p{margin:8px auto 17px;max-width:330px;color:var(--muted);font-size:14px}
    .back {background:none;border:0;color:var(--muted);padding:9px 0;font-size:14px;margin-bottom:13px}
    .hero {position:relative;border-radius:22px;background:radial-gradient(ellipse at 90% 5%,var(--hero-glow,#46305c),transparent 55%),#1b1825;border:1px solid var(--stroke);padding:18px;margin-bottom:16px;overflow:hidden}
    .hero-top{display:flex;gap:15px;align-items:center}.portrait{width:86px;height:96px;flex:none;border-radius:15px;background:linear-gradient(145deg,var(--accent),#2d253c);display:grid;place-items:center;font-size:36px;border:1px solid #ffffff2b;overflow:hidden}.portrait img{width:100%;height:100%;object-fit:cover}
    .hero h1{font-family:Georgia,serif;font-size:26px;font-weight:normal;line-height:1.08;margin:0 0 7px}.hero small{color:#c9bfd5}.hero-actions{margin-top:14px}
    .tabs {display:flex;overflow-x:auto;gap:8px;padding:4px 0 14px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border-radius:20px;border:1px solid var(--stroke);background:var(--panel);color:var(--muted);padding:9px 14px;white-space:nowrap;font-size:14px;font-weight:600}.tab.active{background:var(--accent-soft);color:#f8efff;border-color:var(--accent)}
    .content {border:1px solid var(--stroke);border-radius:var(--radius);background:var(--panel);padding:19px;min-height:220px}.content h2{margin:0;font-size:19px;font-family:Georgia,serif;font-weight:normal}.content .richtext{white-space:pre-wrap;overflow-wrap:anywhere;margin:17px 0;color:#e5e0ed;line-height:1.65}.content .placeholder{color:var(--muted);font-style:italic}
    .gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(115px,1fr));gap:10px;margin:16px 0}.photo{border:1px solid var(--stroke);border-radius:12px;overflow:hidden;background:#111119}.photo img{width:100%;aspect-ratio:1;object-fit:cover;display:block}.photo footer{display:flex;justify-content:space-between;gap:4px;align-items:center;padding:6px;font-size:11px;color:var(--muted)}.photo footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.photo button{border:0;background:none;color:#fab5c3;font-size:18px;line-height:1}
    .field{margin:14px 0}.field label{display:block;font-weight:650;font-size:13px;margin-bottom:6px}.field input:not([type=checkbox]):not([type=color]):not([type=file]),.field select,.field textarea {width:100%;background:#11121a;color:var(--text);border:1px solid #444052;padding:12px;border-radius:11px;font-size:16px;outline:none}
    textarea{resize:vertical;min-height:150px}.field input[type=color]{width:60px;height:40px;background:transparent;padding:1px;border:1px solid var(--stroke);border-radius:9px}.field textarea{line-height:1.5}
    .checkline{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:7px 0}.checkline input{accent-color:#ba92ee;margin-top:3px;transform:scale(1.2)}
    .modal-wrap {position:fixed;inset:0;background:#05040acc;z-index:100;display:flex;align-items:flex-end;justify-content:center;padding:0;backdrop-filter:blur(4px)}.modal {background:#201e2a;border:1px solid #51455c;border-radius:23px 23px 0 0;padding:21px 20px calc(25px + env(safe-area-inset-bottom));width:min(100%,600px);max-height:90dvh;overflow-y:auto;box-shadow:0 -20px 55px #0008}.modal h2{font:normal 24px Georgia,serif;margin:0}.modal .buttons{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap;margin-top:22px}
    .muted{color:var(--muted)}.note{font-size:12px;color:var(--muted);line-height:1.5}.pill{display:inline-block;background:#ffffff12;border:1px solid #ffffff20;border-radius:30px;padding:4px 9px;font-size:12px;color:#ddd2e6}
    .toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#30283b;border:1px solid #6c537d;color:white;border-radius:14px;padding:11px 16px;max-width:90vw;text-align:center;z-index:200;box-shadow:0 5px 30px #0008}
    .settings {border:1px solid var(--stroke);border-radius:18px;background:var(--panel);padding:16px;margin:14px 0}.settings p{font-size:13px;color:var(--muted);margin:5px 0 14px}
    @media(min-width:700px){.shell{padding-top:35px}.modal-wrap{align-items:center;padding:20px}.modal{border-radius:21px}.hero h1{font-size:31px}}
  </style>
</head>
<body>
 <div id="app" class="shell"></div><div id="modal-root"></div><div id="toast-root"></div>
 <script>
(()=>{'use strict';
const DB_NAME='elsewhere-oc-archive-v1', STORE='app';
const DEFAULT_TABS=['Overview','Appearance','Personality','Backstory','Abilities','Relationships','Trivia'];
const BLANK=()=>({version:1,fandoms:[],ocs:[]});
let data=BLANK();let ui={screen:'home',view:'fandoms',fandomId:null,ocId:null,tabId:null,search:''};let db;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>typeof crypto!=='undefined' && crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const fBy=id=>data.fandoms.find(x=>x.id===id),oBy=id=>data.ocs.find(x=>x.id===id);
const defaultTabs=()=>DEFAULT_TABS.map(name=>({id:uid(),name,text:'',images:[]}));
const color=x=>/^#[0-9a-f]{6}$/i.test(x||'')?x:'#ad8bd4';
const theme=oc=>{let f=fBy(oc?.fandomIds?.[0]);let base=color(f?.color||'#bd92fa');return oc&&!oc.inheritTheme?color(oc.accent):base};
const save=async()=>{try{if(db){await new Promise((res,rej)=>{const tr=db.transaction(STORE,'readwrite');tr.objectStore(STORE).put(data,'archive');tr.oncomplete=res;tr.onerror=()=>rej(tr.error)})}else{localStorage.setItem(DB_NAME,JSON.stringify(data));}}catch(e){console.warn(e);alert('Could not save everything on this device. Please export a backup in Settings.');}};
const openDB=()=>new Promise(resolve=>{if(!window.indexedDB){resolve(null);return;}try {const r=indexedDB.open(DB_NAME,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(STORE))r.result.createObjectStore(STORE)};r.onsuccess=()=>resolve(r.result);r.onerror=()=>resolve(null)} catch(e) {resolve(null)}});
const load=async()=>{db=await openDB();try{if(db){const found=await new Promise((res,rej)=>{const r=db.transaction(STORE,'readonly').objectStore(STORE).get('archive');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});if(found){data=found;return;}}else{const s=localStorage.getItem(DB_NAME);if(s)data=JSON.parse(s);}}catch(e){console.warn('Restore failed',e)}};
function toast(msg){const root=$('toast-root');root.innerHTML='<div class="toast">'+esc(msg)+'</div>';setTimeout(()=>{if(root)root.innerHTML=''},3100)};
function openModal(inner){$('modal-root').innerHTML='<div class="modal-wrap" id="modal-overlay"><div class="modal" role="dialog" aria-modal="true">'+inner+'</div></div>';$('modal-overlay').addEventListener('click',e=>{if(e.target.id==='modal-overlay')closeModal()});}
function closeModal(){$('modal-root').innerHTML=''};
const field=(id,label,value='',type='text')=>'<div class="field"><label for="'+id+'">'+esc(label)+'</label><input type="'+type+'" id="'+id+'" value="'+esc(value)+'"></div>';
const btn=(label,fn,classes='')=>'<button type="button" class="btn '+classes+'" data-action="'+fn+'">'+label+'</button>';
function header(){return '<header class="top"><div class="brand"><div class="brandmark">✦</div><div><div class="brandtitle">Elsewhere</div><div class="tagline">Every story has a home.</div></div></div><button class="btn small ghost" data-action="settings" aria-label="Settings">⚙ Settings</button></header>'}
function render(){document.documentElement.style.setProperty('--accent',ui.screen==='oc'?theme(oBy(ui.ocId)):'#bd92fa');document.documentElement.style.setProperty('--accent-soft',ui.screen==='oc'?theme(oBy(ui.ocId))+'33':'#352648');$('app').innerHTML=header()+(ui.screen==='home'?home():ui.screen==='fandom'?fandomPage():ui.screen==='oc'?ocPage():settingsPage());}
function home(){return '<h1 class="heading">Your universes</h1><p class="help">A home for every character you create.</p><div class="switch"><button data-action="viewFandoms" class="'+(ui.view==='fandoms'?'active':'')+'">Fandoms</button><button data-action="viewAll" class="'+(ui.view==='all'?'active':'')+'">All OCs</button></div><input id="search" class="search" placeholder="Search '+(ui.view==='fandoms'?'fandoms':'characters')+'..." type="search" value="'+esc(ui.search)+'" aria-label="Search"><div class="section-head"><strong>'+(ui.view==='fandoms'?'Fandom library':'All characters')+'</strong>'+btn(ui.view==='fandoms'?'+ New fandom':'+ New OC',ui.view==='fandoms'?'newFandom':'newOc','small primary')+'</div><div id="listing">'+listing()+'</div><div class="settings" style="margin-top:28px"><strong>💾 Your stories stay yours</strong><p>Saved on this device. Export backups regularly, especially before clearing Safari website data.</p>'+btn('Export backup','backup','small')+'</div>'}
function listing(){const q=ui.search.trim().toLowerCase();if(ui.view==='fandoms'){const fandoms=data.fandoms.filter(f=>!q||f.name.toLowerCase().includes(q)||f.description.toLowerCase().includes(q));if(!fandoms.length)return emptyState('📚',q?'No matching fandoms':'Your library starts here',q?'Try another search.':'Create a fandom to start organizing your characters.',q?'':'newFandom','+ Add your first fandom');return '<div class="cards">'+fandoms.map(f=>'<button class="card" data-action="openFandom" data-id="'+f.id+'" style="--tile:'+color(f.color)+'"><span class="tile">✦</span><span class="card-content"><span class="card-title">'+esc(f.name)+'</span><span class="card-sub">'+esc(f.description||data.ocs.filter(o=>o.fandomIds.includes(f.id)).length+' characters')+'</span></span><span class="arrow">›</span></button>').join('')+'</div>'}
const ocs=data.ocs.filter(o=>!q||(o.name+' '+o.subtitle+' '+o.fandomIds.map(id=>fBy(id)?.name).join(' ')).toLowerCase().includes(q)).sort((a,b)=>a.name.localeCompare(b.name));if(!ocs.length)return emptyState('✨',q?'No matching OCs':'No characters yet',q?'Try another search.':'Create your first OC to get started.',q?'':'newOc','+ Add a character');return '<div class="cards">'+ocs.map(ocCard).join('')+'</div>';
}
function emptyState(emoji,title,msg,act,label){return '<div class="empty"><div class="emoji">'+emoji+'</div><strong>'+esc(title)+'</strong><p>'+esc(msg)+'</p>'+(act?btn(label,act,'primary'):'')+'</div>'}
function ocCard(o){let f=o.fandomIds.map(id=>fBy(id)?.name).filter(Boolean);return '<button class="card" data-action="openOc" data-id="'+o.id+'" style="--tile:'+theme(o)+'"><span class="tile">'+(o.portrait?'<img alt="" src="'+o.portrait+'">':'✧')+'</span><span class="card-content"><span class="card-title">'+esc(o.name)+'</span><span class="card-sub">'+esc([o.subtitle,f.join(' · ')].filter(Boolean).join(' • ')||'Character profile')+'</span></span><span class="arrow">›</span></button>'}
function fandomPage(){const f=fBy(ui.fandomId);if(!f){ui.screen='home';return home()};const ocs=data.ocs.filter(o=>o.fandomIds.includes(f.id)).sort((a,b)=>a.name.localeCompare(b.name));return '<button class="back" data-action="home">‹ All fandoms</button><div class="hero" style="--hero-glow:'+color(f.color)+'55"><div class="row between"><div><h1 class="heading">'+esc(f.name)+'</h1><p class="help">'+esc(f.description||'Your characters in this universe.')+'</p></div>'+btn('✎ Edit','editFandom','small')+'</div></div><div class="section-head"><strong>Characters ('+ocs.length+')</strong>'+btn('+ Add OC','newOc','small primary')+'</div>'+(ocs.length?'<div class="cards">'+ocs.map(ocCard).join('')+'</div>':emptyState('🌙','No OCs here yet','Add a character to this fandom.','newOc','+ Create an OC'))}
function ocPage(){const o=oBy(ui.ocId);if(!o){ui.screen='home';return home()}const t=o.tabs.find(t=>t.id===ui.tabId)||o.tabs[0];if(t)ui.tabId=t.id;const names=o.fandomIds.map(id=>fBy(id)?.name).filter(Boolean);return '<button class="back" data-action="goBack">‹ '+(ui.fandomId?'Back to fandom':'All characters')+'</button><div class="hero" style="--hero-glow:'+theme(o)+'44"><div class="hero-top"><div class="portrait">'+(o.portrait?'<img src="'+o.portrait+'" alt="Character portrait">':'✧')+'</div><div style="min-width:0"><h1>'+esc(o.name)+'</h1><small>'+esc(o.subtitle||names.join(' · ')||'Original character')+'</small><div class="row" style="margin-top:8px">'+names.map(n=>'<span class="pill">'+esc(n)+'</span>').join('')+'</div></div></div><div class="row hero-actions">'+btn('✎ Profile','editOc','small')+btn('⇧ Share OC','shareOc','small')+btn('🎨 Theme','editOc','small')+'</div></div><div class="tabs">'+o.tabs.map(x=>'<button class="tab '+(t?.id===x.id?'active':'')+'" data-action="tab" data-id="'+x.id+'">'+esc(x.name)+'</button>').join('')+'<button class="tab" data-action="newTab">+ Tab</button></div>'+(t?'<article class="content"><div class="row between"><h2>'+esc(t.name)+'</h2><span class="row">'+btn('✎ Edit','editTab','small')+btn('•••','tabOptions','small ghost')+'</span></div>'+(t.text?'<div class="richtext">'+esc(t.text)+'</div>':'<p class="richtext placeholder">Nothing here yet. Add your character details whenever you\'re ready.</p>')+(t.images?.length?'<div class="gallery">'+t.images.map(img=>'<div class="photo"><img src="'+img.data+'" alt="'+esc(img.name)+'"><footer><span>'+esc(img.name)+'</span><button aria-label="Remove image" data-action="removeImage" data-id="'+img.id+'">×</button></footer></div>').join('')+'</div>':'')+'<div class="row" style="margin-top:20px">'+btn('+ Add photos','addImages','small')+btn('Paste sheet','pasteSheet','small')+'</div><input type="file" accept="image/*" multiple id="image-input" hidden></article>':'')}
function settingsPage(){return '<button class="back" data-action="home">‹ Back</button><h1 class="heading">Settings & backups</h1><div class="settings"><strong>Export your whole archive</strong><p>Download all fandoms, profiles, text, and pictures in one JSON backup. Keep it in Files or iCloud Drive.</p>'+btn('↓ Download backup','backup','primary')+'</div><div class="settings"><strong>Restore a backup</strong><p>Import a backup from this app on either device. Restoring replaces the archive currently saved on this device.</p>'+btn('↑ Restore from file','restore')+'<input type="file" id="restore-input" accept=".json,application/json" hidden></div><div class="settings"><strong>Privacy & storage</strong><p>This version saves your content on this device in the browser. There is no account or automatic iPhone–iPad sync. If you publish the code on GitHub Pages, the website will be public, but your character entries are not uploaded to that repository by this app.</p><p>Safari storage can be cleared or evicted. Please export backups regularly.</p></div><div class="settings"><strong>Elsewhere · v1</strong><p>Built for creating, organizing, decorating, and sharing your worlds. Dark mode forever. ✦</p></div>'}
function fandomEditor(id){const f=fBy(id);openModal('<h2>'+(f?'Edit fandom':'New fandom')+'</h2><p class="help">Make this universe your own.</p>'+field('f-name','Fandom name',f?.name||'')+field('f-desc','Description (optional)',f?.description||'')+field('f-color','Theme color',f?.color||'#a485d6','color')+'<div class="buttons">'+(f?btn('Delete fandom','deleteFandom','small danger'):'')+btn('Cancel','close','small')+btn('Save fandom','saveFandom','primary')+'</div>');$('f-name').focus();}
function ocEditor(id){const oc=oBy(id);const preselect=ui.screen==='fandom'&&ui.fandomId?[ui.fandomId]:[];let selected=oc?.fandomIds||preselect;openModal('<h2>'+(oc?'Edit character':'New character')+'</h2><p class="help">Start with a name. Everything else can change later.</p>'+field('o-name','Character name',oc?.name||'')+field('o-sub','Subtitle / hero name / short description',oc?.subtitle||'')+'<div class="field"><label>Fandoms (choose any)</label>'+(data.fandoms.length?data.fandoms.map(f=>'<label class="checkline"><input type="checkbox" class="fandom-choice" value="'+f.id+'" '+(selected.includes(f.id)?'checked':'')+'>'+esc(f.name)+'</label>').join(''):'<p class="help">No fandoms yet. You can add one later.</p>')+'</div><div class="field"><label>Portrait picture (optional)</label><input type="file" id="portrait-input" accept="image/*"></div><label class="checkline"><input type="checkbox" id="o-inherit" '+(!oc||oc.inheritTheme?'checked':'')+'>Use fandom colors</label>'+field('o-color','Custom accent color',oc?.accent||'#bd92fa','color')+'<div class="buttons">'+(oc?btn('Delete OC','deleteOc','small danger'):'')+btn('Cancel','close','small')+btn('Save character','saveOc','primary')+'</div>');$('o-name').focus();}
function tabEditor(){const o=oBy(ui.ocId),t=o?.tabs.find(t=>t.id===ui.tabId);if(!t)return;openModal('<h2>Edit '+esc(t.name)+'</h2><div class="field"><label for="tab-text">Write as much as you like</label><textarea rows="12" id="tab-text" placeholder="Everything you want to remember...">'+esc(t.text||'')+'</textarea></div><div class="buttons">'+btn('Cancel','close','small')+btn('Save changes','saveTab','primary')+'</div>')}
function tabOptions(){const o=oBy(ui.ocId),t=o?.tabs.find(t=>t.id===ui.tabId);if(!t)return;openModal('<h2>Tab options</h2>'+field('tab-name','Rename tab',t.name)+'<div class="buttons">'+btn('Delete tab','deleteTab','small danger')+btn('Cancel','close','small')+btn('Save name','renameTab','primary')+'</div>')}
function newTab(){openModal('<h2>New tab</h2>'+field('tab-name','Tab name','')+'<div class="buttons">'+btn('Cancel','close','small')+btn('Add tab','createTab','primary')+'</div>')}
function shareText(o,onlyTab=false,summary=false){let s=o.name+'\n'+[o.subtitle, o.fandomIds.map(id=>fBy(id)?.name).filter(Boolean).join(' · ')].filter(Boolean).join(' | ')+'\n';let tabs=onlyTab?o.tabs.filter(t=>t.id===ui.tabId):o.tabs;for(const t of tabs){if(summary&&!t.text)continue;s+='\n'+t.name.toUpperCase()+'\n'+(t.text||'(Not filled in)')+'\n';if(t.images?.length)s+='[Photos attached in Elsewhere: '+t.images.map(i=>i.name).join(', ')+']\n'}return s.trim()}
function shareOc(){openModal('<h2>Share your OC</h2><p class="help">Ready to paste into ChatGPT or send to someone? No screenshots needed for text.</p><div class="field"><label for="share-mode">What to share</label><select id="share-mode"><option value="full">Entire profile</option><option value="tab">Current tab only</option><option value="summary">Filled-in sections only</option></select></div><p class="note">Text export notes which pictures exist. To share the actual pictures, attach them separately or use your full archive backup for safekeeping.</p><div class="buttons">'+btn('Cancel','close','small')+btn('Download .txt','downloadShare')+btn('Copy text','copyShare','primary')+'</div>')}
function fileDownload(name,body,type){const b=new Blob([body],{type});const url=URL.createObjectURL(b);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)};
function backup(){fileDownload('elsewhere-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(data,null,2),'application/json');toast('Backup ready! Save it in Files or iCloud Drive.');}
const imageToData=file=>new Promise((resolve,reject)=>{if(!file.type.startsWith('image/')){reject(new Error('Not an image'));return;}const r=new FileReader();r.onerror=()=>reject(new Error('File could not be read'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(new Error('Image could not be opened'));im.onload=()=>{const ratio=Math.min(1,1400/Math.max(im.width,im.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(im.width*ratio));canvas.height=Math.max(1,Math.round(im.height*ratio));canvas.getContext('2d').drawImage(im,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',.8))};im.src=r.result};r.readAsDataURL(file)});
function safeFile(s){return String(s||'character').replace(/[^a-z0-9_\-]+/gi,'-').slice(0,60)||'character'};
async function act(action,id){if(action==='home'){ui.screen='home';ui.fandomId=null;ui.ocId=null;ui.search='';render();return}if(action==='viewFandoms'||action==='viewAll'){ui.view=action==='viewFandoms'?'fandoms':'all';ui.search='';render();return}if(action==='openFandom'){ui.fandomId=id;ui.screen='fandom';render();return}if(action==='openOc'){ui.ocId=id;ui.tabId=oBy(id)?.tabs?.[0]?.id;ui.screen='oc';render();return}if(action==='goBack'){ui.screen=ui.fandomId?'fandom':'home';render();return}if(action==='tab'){ui.tabId=id;render();return}if(action==='settings'){ui.screen='settings';render();return}if(action==='close'){closeModal();return}if(action==='newFandom'||action==='editFandom'){fandomEditor(action==='editFandom'?ui.fandomId:null);return}
if(action==='saveFandom'){const n=$('f-name').value.trim();if(!n){alert('Give this fandom a name first.');return}if(ui.screen==='fandom'&&fBy(ui.fandomId)){Object.assign(fBy(ui.fandomId),{name:n,description:$('f-desc').value,color:$('f-color').value})}else data.fandoms.push({id:uid(),name:n,description:$('f-desc').value,color:$('f-color').value});await save();closeModal();render();toast('Fandom saved ✦');return}
if(action==='deleteFandom'){if(!confirm('Delete this fandom? Its characters will stay in your library, but the fandom association will be removed.'))return;const id=ui.fandomId;data.fandoms=data.fandoms.filter(f=>f.id!==id);data.ocs.forEach(o=>o.fandomIds=o.fandomIds.filter(x=>x!==id));await save();closeModal();ui.screen='home';ui.fandomId=null;render();return}
if(action==='newOc'||action==='editOc'){ocEditor(action==='editOc'?ui.ocId:null);return}
if(action==='saveOc'){const name=$('o-name').value.trim();if(!name){alert('Give this character a name first.');return}const choices=[...document.querySelectorAll('.fandom-choice:checked')].map(x=>x.value);const f=$('portrait-input').files[0];let portrait;if(f){try{portrait=await imageToData(f)}catch(e){alert('Could not read the portrait: '+e.message);return}}const oc=ui.screen==='oc'?oBy(ui.ocId):null;if(oc){Object.assign(oc,{name,subtitle:$('o-sub').value,fandomIds:choices,inheritTheme:$('o-inherit').checked,accent:$('o-color').value});if(portrait)oc.portrait=portrait}else{const o={id:uid(),name,subtitle:$('o-sub').value,fandomIds:choices,inheritTheme:$('o-inherit').checked,accent:$('o-color').value,portrait:portrait||null,tabs:defaultTabs()};data.ocs.push(o);ui.ocId=o.id;ui.tabId=o.tabs[0].id;ui.screen='oc'}await save();closeModal();render();toast('Character saved ✦');return}
if(action==='deleteOc'){const o=oBy(ui.ocId);if(!confirm('Permanently delete '+o.name+' and all their details and photos from this device?'))return;data.ocs=data.ocs.filter(x=>x.id!==o.id);await save();closeModal();ui.screen=ui.fandomId?'fandom':'home';ui.ocId=null;render();return}
if(action==='editTab'){tabEditor();return}if(action==='saveTab'){const t=oBy(ui.ocId)?.tabs.find(x=>x.id===ui.tabId);t.text=$('tab-text').value;await save();closeModal();render();toast('Tab saved ✦');return}
if(action==='newTab'){newTab();return}if(action==='createTab'){const name=$('tab-name').value.trim();if(!name){alert('Give your tab a name.');return}const t={id:uid(),name,text:'',images:[]};oBy(ui.ocId).tabs.push(t);ui.tabId=t.id;await save();closeModal();render();return}
if(action==='tabOptions'){tabOptions();return}if(action==='renameTab'){const n=$('tab-name').value.trim();if(!n){alert('Enter a name.');return}oBy(ui.ocId).tabs.find(t=>t.id===ui.tabId).name=n;await save();closeModal();render();return}
if(action==='deleteTab'){const o=oBy(ui.ocId);if(o.tabs.length<2){alert('Keep at least one tab.');return}if(!confirm('Delete this tab, including its notes and photos?'))return;o.tabs=o.tabs.filter(t=>t.id!==ui.tabId);ui.tabId=o.tabs[0].id;await save();closeModal();render();return}
if(action==='addImages'){$('image-input')?.click();return}
if(action==='removeImage'){if(!confirm('Remove this photo from the tab?'))return;const t=oBy(ui.ocId).tabs.find(t=>t.id===ui.tabId);t.images=t.images.filter(i=>i.id!==id);await save();render();return}
if(action==='pasteSheet'){openModal('<h2>Paste your existing sheet</h2><p class="help">Copy your Discord or Notes character sheet here. We\'ll keep the text intact in this tab without guessing what should be canon.</p><div class="field"><label for="sheet">Character sheet</label><textarea rows="10" id="sheet" placeholder="Paste here..."></textarea></div><div class="buttons">'+btn('Cancel','close','small')+btn('Save pasted text','saveSheet','primary')+'</div>');return}
if(action==='saveSheet'){const v=$('sheet').value.trim();if(!v){alert('Paste your sheet first.');return}const t=oBy(ui.ocId).tabs.find(t=>t.id===ui.tabId);t.text=[t.text,v].filter(Boolean).join('\n\n──── Imported Notes ────\n\n');await save();closeModal();render();toast('Text saved safely ✦');return}
if(action==='shareOc'){shareOc();return}
if(action==='copyShare'||action==='downloadShare'){const mode=$('share-mode').value;const text=shareText(oBy(ui.ocId),mode==='tab',mode==='summary');if(action==='downloadShare'){fileDownload(safeFile(oBy(ui.ocId).name)+'.txt',text,'text/plain');toast('Character text downloaded');return}try{await navigator.clipboard.writeText(text);toast('Copied! Paste it into our chat.')}catch(e){const a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('Copied! Paste it into our chat.')}closeModal();return}
if(action==='backup'){backup();return}if(action==='restore'){$('restore-input')?.click();return}
}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();act(a.dataset.action,a.dataset.id)}});
document.addEventListener('input',e=>{if(e.target.id==='search'){ui.search=e.target.value;const list=$('listing');if(list)list.innerHTML=listing()}});
document.addEventListener('change',async e=>{if(e.target.id==='image-input'){const files=[...e.target.files];if(!files.length)return;const t=oBy(ui.ocId)?.tabs.find(t=>t.id===ui.tabId);if(!t)return;for(const f of files){try{const img=await imageToData(f);t.images.push({id:uid(),name:f.name,data:img})}catch(err){alert('Could not add '+f.name+': '+err.message)}}await save();render();toast('Photos added ✦')}
if(e.target.id==='restore-input'){const f=e.target.files?.[0];if(!f)return;try{const incoming=JSON.parse(await f.text());if(!Array.isArray(incoming.fandoms)||!Array.isArray(incoming.ocs))throw Error('Not an Elsewhere backup');if(!confirm('Replace this device\'s current archive with the backup? Export your current archive first if you want to keep it.'))return;data=incoming;ui={screen:'home',view:'fandoms',fandomId:null,ocId:null,tabId:null,search:''};await save();render();toast('Archive restored ✦')}catch(err){alert('Could not restore: '+err.message)}}});
window.addEventListener('unhandledrejection',e=>{console.error(e.reason);toast('Something went wrong. Export a backup if you can.')});
load().then(render);
})();
 </script>
